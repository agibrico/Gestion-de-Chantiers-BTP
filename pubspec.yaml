name: agb_chantier
description: Solution professionnelle de gestion, suivi et pilotage de chantiers BTP pour le Groupe AGB.
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Navigation & Architecture
  go_router: ^14.0.0
  flutter_bloc: ^8.1.6
  get_it: ^7.7.0
  equatable: ^2.0.5
  dartz: ^0.10.1
  shared_preferences: ^2.2.3
  
  # UI & Design System
  lucide_icons: ^0.301.0
  google_fonts: ^6.2.1
  flutter_spinkit: ^5.2.1
  shimmer: ^3.0.0
  fl_chart: ^0.66.2
  
  # Data & Persistence
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.3
  intl: ^0.19.0
  
  # Utils
  logger: ^2.3.0
  flutter_svg: ^2.0.10
  share_plus: ^9.0.0
  file_picker: ^8.0.0
  camera: ^0.11.0+1
  geolocator: ^12.0.0
  image_picker: ^1.1.2
  permission_handler: ^11.3.1
  uuid: ^4.3.3
  pdf: ^3.11.1
  printing: ^5.13.2
  open_filex: ^4.5.0
  mobile_scanner: ^5.1.1
  qr_flutter: ^4.1.0
  connectivity_plus: ^6.0.3
  dio: ^5.4.3+1
  flutter_secure_storage: ^9.0.0
  local_auth: ^2.2.0
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.3
  
  # Code Generation
  build_runner: ^2.4.9
  isar_generator: ^3.1.0+1
  
  # Linting
  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/branding/
