name: AGB CHANTIER SaaS & Android CI/CD

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write
  actions: read

jobs:
  build-and-validate:
    name: Build Web App & Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies
        run: npm ci

      - name: Check TypeScript & Linting
        run: npm run lint

      - name: Regression tests
        run: npm test

      - name: Build Production Web App
        run: npm run build

      - name: Upload Web Dist Artifact
        uses: actions/upload-artifact@v4
        with:
          name: agb-chantier-saas-dist
          path: dist/

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: agb-chantier-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Deploy APK to GitHub Releases
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: "AGB CHANTIER - Dernier APK Debug"
          body: |
            ### 📱 Application Android AGB CHANTIER (APK Debug)
            
            - **Identifiant :** `ci.agb.chantier`
            - **Version :** `0.2.0`
            - **Fichier :** `app-debug.apk`
            - **Build :** Automatique via GitHub Actions
            
            Téléchargez le fichier `app-debug.apk` ci-dessous pour installer l'application sur votre appareil Android.
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
