<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500">
  <defs>
    <!-- Gradients for AGB Blue Circuit Signature -->
    <linearGradient id="agbBlueGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
    <linearGradient id="agbBlueGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="agbHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0284C7" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- LOGO EMBLEM GRAPHIC -->
  <g filter="url(#subtleGlow)" transform="translate(140, 20)">
    <!-- Letter 'A' Form -->
    <path d="M170 20 L270 200 L210 200 L180 140 L110 200 L70 200 L170 20 Z" fill="url(#agbBlueGrad1)" />
    <path d="M170 65 L135 170 L175 170 Z" fill="#FFFFFF" opacity="0.95" />
    <path d="M170 20 L70 200 C50 235 90 270 145 240 C175 225 190 190 220 180 C260 170 290 200 310 240" fill="none" stroke="url(#agbBlueGrad1)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Letter 'G' Circuit Form -->
    <circle cx="390" cy="155" r="95" fill="none" stroke="url(#agbBlueGrad1)" stroke-width="36" />
    <path d="M390 60 A95 95 0 0 1 485 155 L400 155" fill="none" stroke="url(#agbBlueGrad2)" stroke-width="36" stroke-linecap="round" />
    
    <!-- Central Node in G -->
    <circle cx="390" cy="155" r="22" fill="url(#agbBlueGrad1)" />
    <circle cx="390" cy="155" r="10" fill="#FFFFFF" />

    <!-- Letter 'B' Circuit Horizontal Lines and Nodes -->
    <!-- Top B Loop & Circuit Line -->
    <path d="M470 100 L530 100" fill="none" stroke="url(#agbBlueGrad2)" stroke-width="18" stroke-linecap="round" />
    <circle cx="535" cy="100" r="14" fill="#0284C7" />
    <circle cx="535" cy="100" r="6" fill="#FFFFFF" />

    <!-- Bottom B Loop & Circuit Line -->
    <path d="M470 210 L530 210" fill="none" stroke="url(#agbBlueGrad2)" stroke-width="18" stroke-linecap="round" />
    <circle cx="535" cy="210" r="14" fill="#0284C7" />
    <circle cx="535" cy="210" r="6" fill="#FFFFFF" />

    <!-- Big B Curve Backing -->
    <path d="M480 60 C580 60 630 100 630 145 C630 165 615 180 590 185 C625 195 645 220 645 255 C645 305 580 340 480 340" fill="none" stroke="url(#agbBlueGrad1)" stroke-width="36" stroke-linecap="round" />
  </g>

  <!-- TYPOGRAPHY / SIGNATURE DETAILS -->
  <g text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <!-- Title Line 1 -->
    <text x="500" y="380" font-size="30" font-weight="900" fill="#0F172A" letter-spacing="1.5">
      CONCEPTEUR D'APPLICATIONS MOBILES
    </text>

    <!-- Title Line 2 -->
    <text x="500" y="418" font-size="30" font-weight="900" fill="#0F172A" letter-spacing="1.5">
      ET SOLUTIONS WEB SUR MESURE
    </text>

    <!-- Contact: Email -->
    <text x="500" y="455" font-size="24" font-weight="600" fill="#1E293B" letter-spacing="0.5">
      atsegillesbrice@gmail.com
    </text>

    <!-- Contact: Phone -->
    <text x="500" y="488" font-size="24" font-weight="700" fill="#0F172A" letter-spacing="1">
      0104818092 / 0797709693
    </text>
  </g>
</svg>
