<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>AGB CHANTIER — Gestion de Chantiers BTP</title>
    <meta name="description" content="Application professionnelle de gestion, suivi, contrôle et pilotage des chantiers de construction." />
    
    <!-- PWA & Mobile Web App Meta -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0F172A" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AGB CHANTIER" />
    <meta name="application-name" content="AGB CHANTIER" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Open Graph Meta -->
    <meta property="og:title" content="AGB CHANTIER — Gestion de Chantiers BTP" />
    <meta property="og:description" content="Application professionnelle de gestion, suivi, contrôle et pilotage des chantiers de construction." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Détection précoce du thème (Système / Préférences) pour éviter tout flash blanc/sombre (FOUC) -->
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('agb_chantier_theme_mode');
          var mode = stored ? JSON.parse(stored) : 'system';
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = mode === 'dark' || (mode === 'system' && prefersDark);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Enregistrement du Service Worker PWA
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((registration) => {
            console.log('[AGB PWA] Service Worker actif:', registration.scope);
          }).catch((err) => {
            console.log('[AGB PWA] Enregistrement SW optionnel:', err);
          });
        });
      }
    </script>
  </body>
</html>
